name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Leave SCHEME empty to auto-detect the first scheme in the project.
  SCHEME: ""
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -eo pipefail

          # Install CocoaPods dependencies if the project uses them
          if [ -f Podfile ]; then
            pod install
          fi

          # Prefer a workspace, fall back to a project
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" \
            -not -path "*/Pods/*" -not -path "*.xcodeproj/*" | head -n1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" \
            -not -path "*/Pods/*" | head -n1)

          if [ -n "$WORKSPACE" ]; then
            BUILD_ARGS=(-workspace "$WORKSPACE")
          elif [ -n "$PROJECT" ]; then
            BUILD_ARGS=(-project "$PROJECT")
          else
            echo "No .xcworkspace or .xcodeproj found" >&2
            exit 1
          fi

          # Auto-detect scheme if none was set
          SCHEME_NAME="$SCHEME"
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME=$(xcodebuild -list -json "${BUILD_ARGS[@]}" \
              | jq -r '(.workspace // .project).schemes[0]')
          fi
          echo "Using scheme: $SCHEME_NAME"

          # Build with code signing disabled
          xcodebuild "${BUILD_ARGS[@]}" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log

          # Package the .app into an IPA
          APP_PATH=$(find "build/Build/Products/${CONFIGURATION}-iphoneos" \
            -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced" >&2
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "${SCHEME_NAME}-unsigned.ipa" Payload

          ls -lh ./*.ipa

      - name: Show compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -n 50 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error
