name: Build Unsigned IPA

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: macos-14 # Uses GitHub's hosted macOS runner
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Required to pull in embedded frameworks like FEX / DXMT

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4' # Adjust if a specific newer SDK version is required

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project Madeira.xcodeproj

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -archivePath build/Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Madeira.xcarchive/Products/Applications/Madeira.app build/Payload/
          cd build
          zip -r Madeira_Unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: build/Madeira_Unsigned.ipa
          if-no-files-found: error
