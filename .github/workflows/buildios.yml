name: Build unsigned IPA

# Runs on GitHub's own macOS machines, so you don't need a Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SCHEME: Madeira
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # harmless if you have none

      # To pin a specific Xcode, add before the build step:
      #   - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # Only runs if the repo uses XcodeGen (project.yml) instead of a committed .xcodeproj
      - name: Generate Xcode project (XcodeGen)
        run: |
          PROJECT_YML=$(find . -name project.yml -not -path '*/node_modules/*' -not -path '*/Pods/*' | head -n 1)
          if [ -n "$PROJECT_YML" ]; then
            brew install xcodegen
            (cd "$(dirname "$PROJECT_YML")" && xcodegen generate)
          else
            echo "No project.yml found, skipping XcodeGen"
          fi

      # Only runs if there is a Podfile
      - name: Install CocoaPods dependencies
        run: |
          PODFILE=$(find . -name Podfile -not -path '*/Pods/*' | head -n 1)
          if [ -n "$PODFILE" ]; then
            (cd "$(dirname "$PODFILE")" && pod install)
          else
            echo "No Podfile found, skipping CocoaPods"
          fi

      - name: Locate workspace / project
        id: find
        run: |
          WS=$(find . -maxdepth 4 -name '*.xcworkspace' -not -path '*/Pods/*' -not -path '*.xcodeproj/*' | head -n 1)
          PROJ=$(find . -maxdepth 4 -name '*.xcodeproj' -not -path '*/Pods/*' | head -n 1)
          if [ -n "$WS" ]; then
            echo "flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WS" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJ" ]; then
            echo "flag=-project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJ" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No .xcworkspace or .xcodeproj found"
            exit 1
          fi
          echo "Using: $WS $PROJ"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            ${{ steps.find.outputs.flag }} "${{ steps.find.outputs.path }}" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' -path '*iphoneos*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app produced"
            exit 1
          fi
          echo "Packaging $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$SCHEME-unsigned.ipa" Payload
          ls -lh "$SCHEME-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-unsigned-ipa
          path: ${{ env.SCHEME }}-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
