name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SCHEME: Madeira
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Stage bundled license files
        run: bash build/stage-licenses.sh

      - name: Build app without code signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project app/Madeira.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/${CONFIGURATION}-iphoneos/$SCHEME.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app was not produced at $APP"
            exit 1
          fi
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "::error::An embedded provisioning profile was found; refusing to package a signed IPA"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$SCHEME-unsigned.ipa" Payload)
          ls -lh "$SCHEME-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
