name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Node.js (npm / yarn / pnpm) ----------
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install and build (Node)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build --if-present

      # ---------- Python ----------
      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install and build (Python)
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != ''
        run: |
          python -m pip install --upgrade pip build
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m build
          fi

      # ---------- Go ----------
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (Go)
        if: hashFiles('go.mod') != ''
        run: go build ./...

      # ---------- Rust ----------
      - name: Set up Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2

      - name: Build (Rust)
        if: hashFiles('Cargo.toml') != ''
        run: cargo build --release

      # ---------- .NET ----------
      - name: Set up .NET
        if: hashFiles('**/*.sln', '**/*.csproj') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (.NET)
        if: hashFiles('**/*.sln', '**/*.csproj') != ''
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      # ---------- Java (Maven / Gradle) ----------
      - name: Set up Java
        if: hashFiles('pom.xml', 'build.gradle', 'build.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || 'gradle' }}

      - name: Build (Maven)
        if: hashFiles('pom.xml') != ''
        run: mvn -B package

      - name: Build (Gradle)
        if: hashFiles('build.gradle', 'build.gradle.kts') != ''
        run: |
          chmod +x ./gradlew
          ./gradlew build

      # ---------- Save the output ----------
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            build/
            out/
            target/release/
            target/*.jar
          if-no-files-found: ignore
